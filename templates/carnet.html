<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet - {{NOMBRE}} {{APELLIDO}}</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #eef1f6; padding: 24px; }
    .barra { max-width: 340px; margin: 0 auto 18px; display: flex; gap: 10px; }
    .barra button { flex: 1; border: 0; border-radius: 8px; padding: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-imprimir { background: #4da32f; color: #fff; }
    .btn-volver { background: #fff; color: #1c2733; border: 1px solid #d6dbe4; }

    .carnet {
      width: 85.6mm;
      height: 90mm;
      margin: 0 auto;
      background: linear-gradient(135deg, #ffffff, #f4f7fc);
      background-image: {!CARNET_FONDO_CSS!};
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      border: 1px solid #d8dee8;
      box-shadow: 0 6px 20px rgba(0,51,98,.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
    }
    .carnet::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.82);
      z-index: 0;
    }
    .carnet > * { position: relative; z-index: 1; }
    .carnet .top {
      width: 100%;
      text-align: center;
      padding: 4.5mm 4mm 2mm;
      min-height: 9mm;
    }
    .carnet .top .logo-empresa {
      height: 10mm;
      max-width: 55mm;
      object-fit: contain;
    }
    .carnet .top .nombre-empresa {
      font-weight: 700;
      font-size: 4mm;
      color: #003362;
      letter-spacing: 0.3px;
    }
    .carnet .foto {
      width: 24mm;
      height: 24mm;
      border-radius: 50%;
      object-fit: cover;
      margin: 3.5mm 0 3mm;
      border: 0.7mm solid #ffffff;
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
      background: #e4e8ef;
    }
    .carnet .nombre { font-size: 4.6mm; font-weight: 800; color: #003362; text-align: center; }
    .carnet .cedula { font-size: 3.2mm; color: #4da32f; font-weight: 700; margin-top: 1.4mm; }
    .carnet .cargo { font-size: 3.2mm; color: #1D2A44; margin-top: 1mm; text-align: center; }
    .carnet .qr { margin-top: 2.6mm; }
    .carnet .qr canvas { width: 16mm; height: 16mm; display: block; }

    @media print {
      body { background: #fff; padding: 0; }
      .barra { display: none; }
      .carnet { box-shadow: none; margin: 0 auto; border-radius: 0; border: none; }
      @page { size: 85.6mm 90mm; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="barra">
    <button class="btn-volver" onclick="location.href='/admin'">← Volver al panel</button>
    <button class="btn-imprimir" onclick="window.print()">🖨 Imprimir</button>
  </div>

  <div class="carnet">
    <div class="top">{!EMPRESA_TOP_HTML!}</div>
    <img class="foto" id="fotoEmpleado" alt="">
    <div class="nombre">{{NOMBRE}} {{APELLIDO}}</div>
    <div class="cedula">{{CEDULA}}</div>
    <div class="cargo">{{CARGO}}</div>
    <div class="qr"><canvas id="qrcode"></canvas></div>
  </div>

  <script>
    var baseUrl = "{{BASE_URL}}";
    var logoEmpresa = "{{EMPRESA_LOGO}}";
    var foto = "{{FOTO}}";

    var fotoEl = document.getElementById("fotoEmpleado");
    if (foto) { fotoEl.src = "/uploads/" + encodeURIComponent(foto); }
    else { fotoEl.style.background = "linear-gradient(135deg,#dbe3f0,#eef1f6)"; }

    var target = baseUrl + "/perfil/" + {{EMP_ID}};
    var canvas = document.getElementById("qrcode");
    QRCode.toCanvas(canvas, target, { width: 150, margin: 1, errorCorrectionLevel: "H" }, function (error) {
      if (error) { console.error(error); return; }
      var logoSrc = logoEmpresa ? "/uploads/" + encodeURIComponent(logoEmpresa) : "/static/logo-sena.png";
      var logo = new Image();
      logo.crossOrigin = "anonymous";
      logo.onload = function () {
        var ctx = canvas.getContext("2d");
        var logoSize = canvas.width * 0.22;
        var x = (canvas.width - logoSize) / 2;
        var y = (canvas.height - logoSize) / 2;
        var pad = 3;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);
        ctx.drawImage(logo, x, y, logoSize, logoSize);
      };
      logo.onerror = function () {};
      logo.src = logoSrc;
    });
  </script>
</body>
</html>
