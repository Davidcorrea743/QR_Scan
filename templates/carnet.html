<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet - {{NOMBRE}} {{APELLIDO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;0,800;0,900;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <link rel="stylesheet" href="/static/carnet.css">
</head>
<body>
  <div class="barra">
    <button class="btn-volver" onclick="location.href='/admin'">← Volver al panel</button>
    <button class="btn-imprimir" onclick="window.print()">🖨 Imprimir</button>
  </div>

  <div class="escala">
    <div class="carnet" style="background-image: {!CARNET_FONDO_CSS!};">
      <div class="top">{!EMPRESA_TOP_HTML!}</div>
      <div class="portrait-wrap">
        <img class="foto" id="fotoEmpleado" alt="">
      </div>
      <div class="content">
        <h1 class="nombre">{{NOMBRE}} {{APELLIDO}}</h1>
        <div class="cargo">{{CARGO}}</div>
        <div class="cedula">C.I.: {{CEDULA}}</div>
        <div class="qr"><canvas id="qrcode"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    var baseUrl = "{{BASE_URL}}";
    var logoEmpresa = "{{EMPRESA_LOGO}}";
    var foto = "{{FOTO}}";

    var fotoEl = document.getElementById("fotoEmpleado");
    if (foto) { fotoEl.src = "/uploads/" + encodeURIComponent(foto); }
    else { fotoEl.style.background = "linear-gradient(135deg,#dbe3f0,#eef1f6)"; }

    var target = baseUrl + "/perfil/" + {{EMP_ID}};
    var canvas = document.getElementById("qrcode");
    QRCode.toCanvas(canvas, target, { width: 300, margin: 1, errorCorrectionLevel: "H", color: { dark: "#ffffff", light: "rgba(0,0,0,0)" } }, function (error) {
      if (error) { console.error(error); return; }
      var logoSrc = logoEmpresa ? "/uploads/" + encodeURIComponent(logoEmpresa) : "/static/logo-sena.png";
      var logo = new Image();
      logo.crossOrigin = "anonymous";
      logo.onload = function () {
        var ctx = canvas.getContext("2d");
        var logoSize = canvas.width * 0.22;
        var x = (canvas.width - logoSize) / 2;
        var y = (canvas.height - logoSize) / 2;
        var pad = 3;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);
        ctx.drawImage(logo, x, y, logoSize, logoSize);
      };
      logo.onerror = function () {};
      logo.src = logoSrc;
    });
  </script>
</body>
</html>
