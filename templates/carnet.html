<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet - {{NOMBRE}} {{APELLIDO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;0,800;0,900;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <link rel="stylesheet" href="/static/carnet.css?v=11">
</head>
<body>
  <div class="barra">
    <button class="btn-volver" onclick="location.href='/admin'">← Volver al panel</button>
    <button class="btn-volver" onclick="location.href='/carnet/{{EMP_ID}}/trasero'">Reverso</button>
    <button class="btn-imprimir" onclick="window.print()">🖨 Imprimir</button>
    <button class="btn-copiar" onclick="copiarURL()">Copiar URL</button>
  </div>

  <div class="escala">
    <div class="carnet" style="background-image: {!CARNET_FONDO_CSS!};">
      {!MARCO_IZQUIERDO_HTML!}
      {!MARCO_DERECHO_HTML!}
      <div class="top">{!EMPRESA_TOP_HTML!}</div>
      <div class="portrait-wrap">
        <img class="foto" id="fotoEmpleado" alt="">
      </div>
      <div class="content">
        <h1 class="nombre">{{NOMBRE}} {{APELLIDO}}</h1>
        <div class="cargo">{{CARGO}}</div>
        <div class="cedula">C.I.: {{CEDULA}}</div>
        <div class="qr"><canvas id="qrcode" style="width: 38px; height: 38px; display: block;"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    var baseUrl = "{{BASE_URL}}";
    var foto = "{{FOTO}}";

    var fotoEl = document.getElementById("fotoEmpleado");
    if (foto) { fotoEl.src = "/uploads/" + encodeURIComponent(foto); }
    else { fotoEl.style.background = "linear-gradient(135deg,#dbe3f0,#eef1f6)"; }

    var target = baseUrl + "/perfil/" + {{EMP_ID}};
    var canvas = document.getElementById("qrcode");
    QRCode.toCanvas(canvas, target, { width: 300, margin: 1, errorCorrectionLevel: "H", color: { dark: "#000000", light: "#ffffff" } }, function (error) {
      if (error) { console.error(error); return; }
      canvas.style.width = "38px";
      canvas.style.height = "38px";
    });

    function copiarURL() {
      var url = baseUrl + "/perfil/" + {{EMP_ID}};
      var btn = document.querySelector(".btn-copiar");
      var aviso = function () {
        var viejo = btn.textContent;
        btn.textContent = "¡URL copiada!";
        setTimeout(function () { btn.textContent = viejo; }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(aviso);
      } else {
        var ta = document.createElement("textarea");
        ta.value = url;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); aviso(); } catch (e) {}
        document.body.removeChild(ta);
      }
    }
  </script>
</body>
</html>
