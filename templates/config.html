<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración empresa - Carnet QR</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
  <header class="panel-header">
    <div class="marca">
      <img src="/static/logo Dimsop_Isotipo.png" alt="Logo">
      <span>Configuración de la empresa</span>
    </div>
    <div class="usuario">
      <span id="nombreUsuario"></span>
      <span class="rol-badge">admin</span>
      <button class="btn btn-borde" onclick="location.href='/admin'">← Volver al panel</button>
      <button class="btn btn-rojo" onclick="logout()">Salir</button>
    </div>
  </header>

  <div class="contenido">
    <div class="tarjeta tarjeta-centrada">
      <h2>Datos de la empresa</h2>
      <p class="txtmuted-sm">Estos datos se muestran en el carnet y en la página que ven quienes escanean el QR.</p>
      <div id="mensaje" class="aviso oculto"></div>

      <div class="form-grid">
        <div class="full">
          <label>Nombre de la empresa</label>
          <input type="text" id="nombre" placeholder="Nombre de la empresa">
        </div>
        <div class="full">
          <label>Redes sociales</label>
          <div id="redesList"></div>
          <button type="button" class="btn btn-borde mt10" onclick="agregarRed()">+ Agregar red</button>
        </div>
        <div>
          <label>Título de la empresa (logo/imagen para el carnet)</label>
          <input type="file" id="titulo" accept="image/png,image/jpeg,image/webp">
          <img id="previewTitulo" alt="" class="preview preview-titulo">
          <button type="button" class="btn btn-rojo btn-xs quitar-imagen oculto" data-campo="titulo" title="Quitar imagen" aria-label="Quitar imagen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
        <div>
          <label>Logo (centro del QR)</label>
          <input type="file" id="logo" accept="image/png,image/jpeg,image/webp">
          <img id="previewLogo" alt="" class="preview preview-logo">
          <button type="button" class="btn btn-rojo btn-xs quitar-imagen oculto" data-campo="logo" title="Quitar imagen" aria-label="Quitar imagen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
        <div>
          <label>Imagen de fondo (perfil público)</label>
          <input type="file" id="fondo" accept="image/png,image/jpeg,image/webp">
          <img id="previewFondo" alt="" class="preview preview-fondo">
          <button type="button" class="btn btn-rojo btn-xs quitar-imagen oculto" data-campo="fondo" title="Quitar imagen" aria-label="Quitar imagen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
        <div>
          <label>Imagen de fondo del carnet</label>
          <input type="file" id="carnetFondo" accept="image/png,image/jpeg,image/webp">
          <img id="previewCarnetFondo" alt="" class="preview preview-fondo">
          <button type="button" class="btn btn-rojo btn-xs quitar-imagen oculto" data-campo="carnet_fondo" title="Quitar imagen" aria-label="Quitar imagen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </div>

      <div class="flexend mt20">
        <button class="btn btn-borde" onclick="location.href='/admin'">Cancelar</button>
        <button class="btn btn-verde" onclick="guardar()">Guardar configuración</button>
      </div>
    </div>
  </div>

  <script src="/static/panel.js"></script>
  <script>
    if (!requiereLogin()) {}
    if (!esAdmin()) { window.location.href = "/admin"; }

    document.getElementById("nombreUsuario").textContent = getUsername();

    var redesGuardadas = [];

    var CAMPOS = {
      titulo: { input: "titulo", preview: "previewTitulo" },
      logo: { input: "logo", preview: "previewLogo" },
      fondo: { input: "fondo", preview: "previewFondo" },
      carnet_fondo: { input: "carnetFondo", preview: "previewCarnetFondo" }
    };

    function botonQuitar(campo) {
      return document.querySelector('.quitar-imagen[data-campo="' + campo + '"]');
    }

    function setImagenPresente(campo, presente) {
      var b = botonQuitar(campo);
      if (b) b.classList.toggle("oculto", !presente);
    }

    function eliminarImagen(campo) {
      api("/api/empresa/imagen/" + campo, { method: "DELETE" }).then(function () {
        var img = document.getElementById(CAMPOS[campo].preview);
        img.removeAttribute("src");
        document.getElementById(CAMPOS[campo].input).value = "";
        setImagenPresente(campo, false);
        var msg = document.getElementById("mensaje");
        msg.classList.remove("error");
        msg.classList.add("aviso");
        msg.textContent = "Imagen eliminada. Quedará en blanco al guardar.";
        setTimeout(function () { msg.classList.add("oculto"); }, 3500);
      }).catch(function (err) {
        var msg = document.getElementById("mensaje");
        msg.classList.remove("aviso");
        msg.classList.add("error");
        msg.textContent = err.message;
      });
    }

    function filaRed(red) {
      var labels = [
        ["linkedin", "LinkedIn"], ["twitter", "X (Twitter)"], ["instagram", "Instagram"],
        ["facebook", "Facebook"], ["tiktok", "TikTok"], ["web", "Sitio web"]
      ];
      var div = document.createElement("div");
      div.className = "flexbtn mb8";
      div.innerHTML =
        '<select class="red-select">' +
        labels.map(function (l) {
          return '<option value="' + l[0] + '"' + (red.label === l[0] ? " selected" : "") + ">" + l[1] + "</option>";
        }).join("") +
        '</select>' +
        '<input type="url" placeholder="https://..." value="' + esc(red.url) + '">' +
        '<button type="button" class="btn btn-rojo btn-xs">✕</button>';
      div.querySelector("button").addEventListener("click", function () { div.remove(); });
      return div;
    }

    function renderRedes() {
      var cont = document.getElementById("redesList");
      cont.innerHTML = "";
      redesGuardadas.forEach(function (r) { cont.appendChild(filaRed(r)); });
    }

    function agregarRed() {
      document.getElementById("redesList").appendChild(filaRed({ label: "linkedin", url: "" }));
    }

    function leerRedes() {
      var filas = document.querySelectorAll("#redesList > div");
      return Array.from(filas).map(function (f) {
        return { label: f.querySelector("select").value, url: f.querySelector("input").value.trim() };
      }).filter(function (r) { return r.url; });
    }

    function cargar() {
      api("/api/empresa").then(function (data) {
        document.getElementById("nombre").value = data.nombre || "";
        var redesRaw = data.redes;
        if (typeof redesRaw === "string") {
          try { redesRaw = JSON.parse(redesRaw); } catch (e) { redesRaw = []; }
        }
        redesGuardadas = Array.isArray(redesRaw) ? redesRaw : [];
        renderRedes();
        Object.keys(CAMPOS).forEach(function (campo) {
          var dato = data[campo];
          if (dato) {
            document.getElementById(CAMPOS[campo].preview).src = "/uploads/" + encodeURIComponent(dato);
            document.getElementById(CAMPOS[campo].preview).dataset.actual = dato;
            setImagenPresente(campo, true);
          } else {
            setImagenPresente(campo, false);
          }
        });
      }).catch(function () {});
    }

    function bindImagen(inputId, campo) {
      document.getElementById(inputId).addEventListener("change", function (e) {
        var f = e.target.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function (ev) { document.getElementById(CAMPOS[campo].preview).src = ev.target.result; };
        r.readAsDataURL(f);
        setImagenPresente(campo, false);
      });
    }
    Object.keys(CAMPOS).forEach(function (campo) { bindImagen(CAMPOS[campo].input, campo); });

    document.querySelectorAll(".quitar-imagen").forEach(function (b) {
      b.addEventListener("click", function () {
        eliminarImagen(b.getAttribute("data-campo"));
      });
    });

    function guardar() {
      var fd = new FormData();
      fd.append("nombre", document.getElementById("nombre").value);
      fd.append("redes", JSON.stringify(leerRedes()));
      var logo = document.getElementById("logo").files[0];
      var fondo = document.getElementById("fondo").files[0];
      var carnetFondo = document.getElementById("carnetFondo").files[0];
      var titulo = document.getElementById("titulo").files[0];
      if (titulo) fd.append("titulo", titulo);
      if (logo) fd.append("logo", logo);
      if (fondo) fd.append("fondo", fondo);
      if (carnetFondo) fd.append("carnet_fondo", carnetFondo);

      api("/api/empresa", { method: "PUT", body: fd }).then(function () {
        var msg = document.getElementById("mensaje");
        msg.textContent = "Configuración guardada correctamente.";
        msg.classList.remove("oculto");
        setTimeout(function () { msg.classList.add("oculto"); }, 3500);
      }).catch(function (err) {
        var msg = document.getElementById("mensaje");
        msg.classList.remove("aviso");
        msg.classList.add("error");
        msg.textContent = err.message;
      });
    }

    cargar();
  </script>
</body>
</html>
